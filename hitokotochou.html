<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとこと帳 - シーン別コミュニケーション練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171F;
    --surface:#1E2330;
    --surface-raised:#272E40;
    --paper:#FBF7F0;
    --text:#F3EFE6;
    --text-muted:#9098A8;
    --accent:#F2A65A;
    --accent-deep:#D98A3D;
    --teal:#6FA8A0;
    --rose:#E1667A;
    --line:#333B4E;
    --radius-a: 26px 26px 26px 6px;
    --radius-b: 26px 26px 6px 26px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3,.heading{
    font-family:'Zen Maru Gothic', 'Hiragino Sans', sans-serif;
    margin:0;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  a,button{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;}

  /* ---------- Home ---------- */
  .home-header{margin-bottom:22px;}
  .home-header .brand{
    display:flex;align-items:baseline;gap:10px;margin-bottom:6px;
  }
  .home-header h1{font-size:28px;font-weight:900;letter-spacing:.02em;color:var(--accent);}
  .home-header .tagline{color:var(--text-muted);font-size:14px;line-height:1.7;}

  .stat-row{
    display:flex;gap:10px;margin:20px 0 26px;
  }
  .stat-chip{
    flex:1;
    background:var(--surface);
    border-radius:18px;
    padding:14px 14px;
    text-align:center;
  }
  .stat-chip .num{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:22px;font-weight:700;color:var(--accent);
    display:block;
  }
  .stat-chip .label{font-size:12px;color:var(--text-muted);margin-top:2px;display:block;}

  .scene-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:420px){
    .scene-grid{grid-template-columns:1fr;}
  }
  .scene-card{
    position:relative;
    background:var(--surface);
    border-radius:var(--radius-a);
    padding:18px 16px 20px;
    text-align:left;
    transition:transform .15s ease, background .15s ease;
  }
  .scene-card:nth-child(even){border-radius:var(--radius-b);}
  .scene-card:nth-child(even)::after{left:auto;right:22px;}
  .scene-card::after{
    content:'';
    position:absolute;
    width:13px;height:13px;
    background:var(--surface);
    bottom:-5px;left:22px;
    transform:rotate(45deg);
    border-radius:3px;
  }
  .scene-card:active{transform:scale(.97);}
  .scene-card .emoji{font-size:26px;display:block;margin-bottom:8px;}
  .scene-card .name{font-family:'Zen Maru Gothic';font-weight:700;font-size:15px;line-height:1.4;margin-bottom:10px;min-height:42px;}
  .scene-progress{
    height:6px;background:var(--surface-raised);border-radius:4px;overflow:hidden;margin-bottom:6px;
  }
  .scene-progress > div{height:100%;background:var(--accent);border-radius:4px;}
  .scene-card .count{font-size:11px;color:var(--text-muted);}

  .footer-link{
    display:block;text-align:center;margin-top:34px;
    font-size:12px;color:var(--text-muted);text-decoration:underline;
    opacity:.7;
  }

  /* ---------- Scene menu ---------- */
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--text-muted);font-size:13px;margin-bottom:18px;
  }
  .scene-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .scene-title .emoji{font-size:30px;}
  .scene-title h2{font-size:22px;font-weight:700;}
  .scene-tagline{color:var(--text-muted);font-size:13px;margin-bottom:22px;}

  .mode-card{
    background:var(--surface);
    border-radius:22px;
    padding:20px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .mode-card .mtext .mtitle{font-family:'Zen Maru Gothic';font-weight:700;font-size:16px;margin-bottom:4px;}
  .mode-card .mtext .mdesc{font-size:12px;color:var(--text-muted);line-height:1.6;}
  .mode-card .go{
    flex-shrink:0;
    background:var(--accent);
    color:#241505;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:14px;
  }
  .mode-card .go:disabled{background:var(--surface-raised);color:var(--text-muted);}

  /* ---------- Chat bubble practice UI ---------- */
  .chat-pane{
    background:var(--surface);
    border-radius:22px;
    padding:24px 18px;
    min-height:280px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:16px;
    margin-bottom:18px;
  }
  .bubble{
    position:relative;
    max-width:86%;
    padding:14px 16px;
    line-height:1.7;
    font-size:14.5px;
    animation:pop .22s ease;
  }
  @keyframes pop{
    from{transform:scale(.9);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .bubble.situation{
    align-self:flex-start;
    background:var(--surface-raised);
    color:var(--text);
    border-radius:4px 20px 20px 20px;
  }
  .bubble.situation::before{
    content:'シーン';
    display:block;
    font-size:10px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .bubble.situation::after{
    content:'';position:absolute;width:11px;height:11px;
    background:var(--surface-raised);
    top:14px;left:-4px;transform:rotate(45deg);border-radius:2px;
  }
  .bubble.reply{
    align-self:flex-end;
    background:var(--accent);
    color:#241505;
    border-radius:20px 4px 20px 20px;
  }
  .bubble.reply::before{
    content:'ひとこと';
    display:block;
    font-size:10px;
    color:#5c3a10;
    margin-bottom:4px;
  }
  .bubble.reply::after{
    content:'';position:absolute;width:11px;height:11px;
    background:var(--accent);
    top:14px;right:-4px;transform:rotate(45deg);border-radius:2px;
  }
  .bubble.tip{
    align-self:flex-end;
    max-width:86%;
    font-size:12.5px;
    color:var(--text-muted);
    padding:0 4px;
  }
  .reveal-btn{
    align-self:center;
    background:var(--surface-raised);
    color:var(--text);
    padding:12px 26px;
    border-radius:16px;
    font-weight:700;
    font-size:14px;
  }
  .review-actions{display:flex;gap:8px;margin-bottom:26px;}
  .review-actions button{
    flex:1;
    padding:13px 6px;
    border-radius:14px;
    font-weight:700;
    font-size:13px;
  }
  .btn-again{background:var(--surface);color:var(--rose);}
  .btn-soso{background:var(--surface);color:var(--accent);}
  .btn-good{background:var(--teal);color:#0d2320;}

  .empty-state{
    background:var(--surface);
    border-radius:22px;
    padding:34px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    line-height:1.8;
  }
  .empty-state .big{font-size:30px;display:block;margin-bottom:10px;}
  .ghost-btn{
    display:inline-block;margin-top:14px;
    background:var(--surface-raised);
    color:var(--text);
    padding:10px 18px;
    border-radius:14px;
    font-size:13px;
  }

  .progress-line{
    text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:14px;
  }

  /* ---------- Quiz ---------- */
  .quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .quiz-opt{
    text-align:left;
    background:var(--surface-raised);
    border:1.5px solid transparent;
    border-radius:16px;
    padding:13px 14px;
    font-size:14px;
    line-height:1.6;
  }
  .quiz-opt.correct{border-color:var(--teal);background:#1C332F;color:var(--teal);}
  .quiz-opt.wrong{border-color:var(--rose);background:#331C24;color:var(--rose);}
  .quiz-opt:disabled{opacity:.55;}
  .quiz-opt:not(:disabled):active{transform:scale(.98);}
  .explain-box{
    margin-top:14px;background:var(--surface-raised);border-radius:16px;padding:14px 16px;
    font-size:13px;color:var(--text-muted);line-height:1.7;
  }
  .explain-box strong{color:var(--text);}
  .next-btn{
    display:block;width:100%;margin-top:16px;
    background:var(--accent);color:#241505;font-weight:700;
    padding:14px;border-radius:16px;font-size:14px;
    text-align:center;
  }
  .quiz-score{
    text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:14px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>

  {

      {id:'celebration-q1', scenario:'友人が出産しました。赤ちゃんとご家族両方への気遣いが伝わるメッセージは？', options:['おめでとうございます、とだけ送る','ご出産おめでとうございます、新しい家族との毎日が素敵な時間になりますように','大変でしたね、とだけ送る','スタンプだけ送る'], correct:1, explanation:'赤ちゃんとご家族両方への気遣いを添えると温かみのあるメッセージになります。'},
      {id:'celebration-q2', scenario:'上司が昇進しました。本人の努力を認める祝福メッセージは？', options:['良かったですね、とだけ送る','ご昇進おめでとうございます、日頃の努力が評価されましたね','羨ましいです','何も送らない'], correct:1, explanation:'「日頃の努力」に触れることで本人の頑張りを認める言葉になります。'},
      {id:'celebration-q3', scenario:'友人が入院から退院しました。喜びと気遣いを両方伝えるメッセージは？', options:['良かったですね、とだけ書く','ご回復おめでとうございます、無理せずゆっくり過ごしてくださいね','大変でしたね、とだけ書く','何も送らない'], correct:1, explanation:'回復の喜びと同時に「無理しないで」という気遣いを添えるのが適切です。'},
      {id:'celebration-q4', scenario:'目上の方の誕生日にメッセージを送ります。適切なトーンは？', options:['誕生日おめでとう！とカジュアルに送る','お誕生日おめでとうございます、これからもどうぞご健勝でお過ごしください','スタンプだけ送る','歳を取りましたね、と送る'], correct:1, explanation:'目上の人には健康を気遣う丁寧な言葉が適しています。'},
      {id:'celebration-q5', scenario:'友人がペットを新しく迎えました。相手が話したくなる祝福メッセージは？', options:['良かったですね、とだけ書く','新しい家族、おめでとうございます！写真もっと見たいです','大変じゃないですか？','反応しない'], correct:1, explanation:'「もっと見たい」という一言は相手が自然に話したくなるきっかけになります。'},
      {id:'celebration-q6', scenario:'同僚が定年退職を迎えました。長年の労をねぎらうメッセージは？', options:['お疲れ様でした、とだけ書く','長年お疲れ様でした、これからのお時間をゆっくり楽しんでください','寂しくなりますね、とだけ書く','何も送らない'], correct:1, explanation:'ねぎらいの言葉と今後への言葉をセットにすると気持ちが伝わりやすいです。'}
    ]
  }
];

const BOX_INTERVALS = [1,2,4,7,14]; // days until next due, indexed by box level (0-4)
const MASTER_BOX = 3;
const STORAGE_KEY = 'hitokotochou_progress_v1';

/* ============ STORAGE ============ */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(str, days){
  const d = new Date(str+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {cards:{}, quizStats:{}, streak:{last:null, count:0}};
}
let PROGRESS = loadProgress();
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
}
function getCardState(id){
  return PROGRESS.cards[id] || {box:0, due: todayStr()};
}
function isDue(id){
  return getCardState(id).due <= todayStr();
}
function reviewCard(id, result){
  const cur = getCardState(id);
  let box = cur.box;
  if(result==='again') box = Math.max(0, box-1);
  else if(result==='good') box = Math.min(BOX_INTERVALS.length-1, box+1);
  // 'soso' keeps box the same
  const due = addDays(todayStr(), BOX_INTERVALS[box]);
  PROGRESS.cards[id] = {box, due};
  touchStreak();
  saveProgress();
}
function touchStreak(){
  const t = todayStr();
  const s = PROGRESS.streak || {last:null, count:0};
  if(s.last === t){ /* already counted today */ }
  else if(s.last === addDays(t,-1)){ s.count += 1; s.last = t; }
  else { s.count = 1; s.last = t; }
  PROGRESS.streak = s;
}
function masteredCount(sceneId){
  const scene = SCENES.find(s=>s.id===sceneId);
  return scene.phrases.filter(p => getCardState(p.id).box >= MASTER_BOX).length;
}
function totalMastered(){
  return SCENES.reduce((sum,s)=>sum+masteredCount(s.id),0);
}
function recordQuizAnswer(sceneId, correct){
  const stats = PROGRESS.quizStats[sceneId] || {correct:0,total:0};
  stats.total += 1;
  if(correct) stats.correct += 1;
  PROGRESS.quizStats[sceneId] = stats;
  touchStreak();
  saveProgress();
}

/* ============ STATE / ROUTER ============ */
let VIEW = {screen:'home'};
let SESSION = {}; // ephemeral session state for flash/quiz

function goHome(){ VIEW = {screen:'home'}; SESSION={}; render(); window.scrollTo(0,0); }
function openScene(id){ VIEW = {screen:'scene', sceneId:id}; SESSION={}; render(); window.scrollTo(0,0); }
function backToSceneMenu(){ VIEW = {screen:'scene', sceneId:VIEW.sceneId}; SESSION={}; render(); window.scrollTo(0,0); }

function startFlash(sceneId){
  const scene = SCENES.find(s=>s.id===sceneId);
  const due = scene.phrases.filter(p=>isDue(p.id));
  SESSION.flashQueue = due.map(p=>p.id);
  SESSION.flashIdx = 0;
  SESSION.flipped = false;
  VIEW = {screen:'scene', sceneId, mode:'flash'};
  render(); window.scrollTo(0,0);
}
function startFlashAll(sceneId){
  const scene = SCENES.find(s=>s.id===sceneId);
  SESSION.flashQueue = scene.phrases.map(p=>p.id);
  SESSION.flashIdx = 0;
  SESSION.flipped = false;
  VIEW = {screen:'scene', sceneId, mode:'flash'};
  render(); window.scrollTo(0,0);
}
function flipCard(){ SESSION.flipped = true; render(); }
function answerCard(result){
  const id = SESSION.flashQueue[SESSION.flashIdx];
  reviewCard(id, result);
  SESSION.flashIdx += 1;
  SESSION.flipped = false;
  render();
}

function startQuiz(sceneId){
  const scene = SCENES.find(s=>s.id===sceneId);
  const order = scene.quiz.map((q,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  SESSION.quizOrder = order;
  SESSION.quizIdx = 0;
  SESSION.quizSelected = null;
  SESSION.quizRoundScore = 0;
  VIEW = {screen:'scene', sceneId, mode:'quiz'};
  render(); window.scrollTo(0,0);
}
function selectQuizOption(optIdx){
  if(SESSION.quizSelected !== null && SESSION.quizSelected !== undefined) return;
  const scene = SCENES.find(s=>s.id===VIEW.sceneId);
  const q = scene.quiz[SESSION.quizOrder[SESSION.quizIdx]];
  SESSION.quizSelected = optIdx;
  const correct = optIdx === q.correct;
  if(correct) SESSION.quizRoundScore += 1;
  recordQuizAnswer(scene.id, correct);
  render();
}
function nextQuizQuestion(){
  SESSION.quizIdx += 1;
  SESSION.quizSelected = null;
  if(SESSION.quizIdx >= SESSION.quizOrder.length){
    VIEW = {screen:'scene', sceneId:VIEW.sceneId, mode:'quizDone'};
  }
  render(); window.scrollTo(0,0);
}
function resetProgress(){
  if(confirm('これまでの学習の進み具合をすべてリセットします。よろしいですか？')){
    PROGRESS = {cards:{}, quizStats:{}, streak:{last:null, count:0}};
    saveProgress();
    goHome();
  }
}

/* ============ RENDER ============ */
function esc(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  if(VIEW.screen==='home') app.innerHTML = renderHome();
  else if(VIEW.screen==='scene') app.innerHTML = renderScene();
  app.scrollTop = 0;
}

function renderHome(){
  const mastered = totalMastered();
  const streak = (PROGRESS.streak && PROGRESS.streak.count) || 0;
  let dueTotal = 0;
  SCENES.forEach(s=> s.phrases.forEach(p=>{ if(isDue(p.id)) dueTotal+=1; }));

  const cards = SCENES.map(s=>{
    const m = masteredCount(s.id);
    const pct = Math.round(m/s.phrases.length*100);
    return `
      <button class="scene-card" onclick="openScene('${s.id}')">
        <span class="emoji">${s.emoji}</span>
        <div class="name">${esc(s.name)}</div>
        <div class="scene-progress"><div style="width:${pct}%"></div></div>
        <div class="count">${m} / ${s.phrases.length} 習得</div>
      </button>`;
  }).join('');

  return `
    <div class="home-header">
      <div class="brand"><h1>ひとこと帳</h1></div>
      <div class="tagline">シーンで学ぶ、伝え方の練習。まずは雑談から、少しずつ広げていきます。</div>
    </div>
    <div class="stat-row">
      <div class="stat-chip"><span class="num">${mastered}</span><span class="label">習得フレーズ</span></div>
      <div class="stat-chip"><span class="num">${streak}</span><span class="label">連続学習日数</span></div>
      <div class="stat-chip"><span class="num">${dueTotal}</span><span class="label">今日の復習</span></div>
    </div>
    <div class="scene-grid">${cards}</div>
    <button class="footer-link" onclick="resetProgress()">進捗をリセットする</button>
  `;
}

function renderScene(){
  const scene = SCENES.find(s=>s.id===VIEW.sceneId);
  const mode = VIEW.mode;

  if(!mode){
    const due = scene.phrases.filter(p=>isDue(p.id)).length;
    const stats = PROGRESS.quizStats[scene.id] || {correct:0,total:0};
    return `
      <button class="back-btn" onclick="goHome()">← シーン一覧</button>
      <div class="scene-title"><span class="emoji">${scene.emoji}</span><h2>${esc(scene.name)}</h2></div>
      <div class="scene-tagline">${esc(scene.tagline)}</div>

      <div class="mode-card">
        <div class="mtext">
          <div class="mtitle">フレーズ暗記</div>
          <div class="mdesc">シーンを見て、ふさわしい一言を思い出す練習。${due>0? `今日は${due}件が復習のタイミングです。` : '今日の分はすべて復習済みです。'}</div>
        </div>
        <button class="go" onclick="${due>0? `startFlash('${scene.id}')` : `startFlashAll('${scene.id}')`}">${due>0? 'はじめる' : '全部練習'}</button>
      </div>

      <div class="mode-card">
        <div class="mtext">
          <div class="mtitle">シーン別クイズ</div>
          <div class="mdesc">場面に合う返し方を4択で選ぶ練習。${stats.total>0? `正答率 ${Math.round(stats.correct/stats.total*100)}%（${stats.total}問挑戦）` : 'まだ挑戦していません'}</div>
        </div>
        <button class="go" onclick="startQuiz('${scene.id}')">はじめる</button>
      </div>
    `;
  }

  if(mode==='flash') return renderFlash(scene);
  if(mode==='quiz') return renderQuiz(scene);
  if(mode==='quizDone') return renderQuizDone(scene);
  return '';
}

function renderFlash(scene){
  const queue = SESSION.flashQueue || [];
  const idx = SESSION.flashIdx || 0;

  if(idx >= queue.length){
    return `
      <button class="back-btn" onclick="backToSceneMenu()">← ${esc(scene.name)}</button>
      <div class="empty-state">
        <span class="big">✅</span>
        今日の分の練習が終わりました。<br>お疲れさまです。
        <br><button class="ghost-btn" onclick="startFlashAll('${scene.id}')">もう一度全部練習する</button>
      </div>
    `;
  }

  const id = queue[idx];
  const p = scene.phrases.find(x=>x.id===id);
  const flipped = SESSION.flipped;

  return `
    <button class="back-btn" onclick="backToSceneMenu()">← ${esc(scene.name)}</button>
    <div class="progress-line">${idx+1} / ${queue.length}</div>
    <div class="chat-pane">
      <div class="bubble situation">${esc(p.situation)}</div>
      ${flipped ? `
        <div class="bubble reply">${esc(p.phrase)}</div>
        <div class="bubble tip">💡 ${esc(p.tip)}</div>
      ` : `
        <button class="reveal-btn" onclick="flipCard()">ひとことを見る</button>
      `}
    </div>
    ${flipped ? `
      <div class="review-actions">
        <button class="btn-again" onclick="answerCard('again')">まだ不安</button>
        <button class="btn-soso" onclick="answerCard('soso')">まあまあ</button>
        <button class="btn-good" onclick="answerCard('good')">覚えた</button>
      </div>
    ` : ''}
  `;
}

function renderQuiz(scene){
  const order = SESSION.quizOrder || [];
  const idx = SESSION.quizIdx || 0;
  const q = scene.quiz[order[idx]];
  const selected = SESSION.quizSelected;
  const answered = selected !== null && selected !== undefined;

  const options = q.options.map((opt,i)=>{
    let cls = 'quiz-opt';
    if(answered && i===q.correct) cls += ' correct';
    else if(answered && i===selected && i!==q.correct) cls += ' wrong';
    return `<button class="${cls}" ${answered?'disabled':''} onclick="selectQuizOption(${i})">${esc(opt)}</button>`;
  }).join('');

  return `
    <button class="back-btn" onclick="backToSceneMenu()">← ${esc(scene.name)}</button>
    <div class="progress-line">${idx+1} / ${order.length}</div>
    <div class="chat-pane" style="min-height:auto;">
      <div class="bubble situation" style="max-width:100%;">${esc(q.scenario)}</div>
    </div>
    <div class="quiz-options">${options}</div>
    ${answered ? `
      <div class="explain-box"><strong>${selected===q.correct? '正解です。':'惜しい。'}</strong> ${esc(q.explanation)}</div>
      <button class="next-btn" onclick="nextQuizQuestion()">${idx+1>=order.length? '結果を見る':'次の問題'}</button>
    ` : ''}
  `;
}

function renderQuizDone(scene){
  const score = SESSION.quizRoundScore || 0;
  const total = (SESSION.quizOrder||[]).length;
  const stats = PROGRESS.quizStats[scene.id] || {correct:0,total:0};
  return `
    <button class="back-btn" onclick="backToSceneMenu()">← ${esc(scene.name)}</button>
    <div class="empty-state">
      <span class="big">🎉</span>
      今回は ${total}問中 ${score}問正解でした。
      <div class="quiz-score" style="margin-top:10px;">通算正答率 ${stats.total>0? Math.round(stats.correct/stats.total*100):0}%（${stats.total}問挑戦）</div>
      <button class="ghost-btn" onclick="startQuiz('${scene.id}')">もう一度挑戦する</button>
    </div>
  `;
}

render();
</script>
